
name: Playwright Cucumber Automation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Execute automation tests
        id: tests
        continue-on-error: true
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          CI: 'true'
        run: npm test

      - name: Generate Allure Report
        if: always()
        run: |
          if [ -d allure-results ] && [ "$(find allure-results -type f | wc -l)" -gt 0 ]; then
            npx allure generate allure-results --clean -o allure-report
          else
            echo "Allure results not found"
            exit 1
          fi

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Allure-Report
          path: allure-report/
          retention-days: 30

      - name: Upload Cucumber HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cucumber-HTML-Report
          path: reports/cucumber-report.html
          if-no-files-found: warn
          retention-days: 30

      - name: Check Test Result
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" = "failure" ]; then
            echo "Automation tests failed"
            exit 1
          fi
